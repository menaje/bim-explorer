name: Reference format qualification
description: 실제 사용자 과업과 공개 근거로 다음 reference format 후보를 제안합니다.
title: "[Format intake] "
labels:
  - enhancement
  - future
body:
  - type: markdown
    attributes:
      value: |
        이 양식은 다음 포맷의 기술 qualification 착수 여부만 판정합니다.
        제출만으로 포맷 admission, production 지원, BIM semantic authority,
        write/round-trip 또는 Spatial authority가 승인되지 않습니다.

        고객·비공개 모델, credential, 토큰, absolute path, 계약서 원문을
        공개 이슈에 첨부하지 마세요. 비공개 근거는 내용 대신 SHA-256 digest로
        식별하고 maintainer가 별도 review할 수 있게 해주세요.

  - type: dropdown
    id: candidate-format
    attributes:
      label: 후보 포맷
      options:
        - LAS
        - LAZ
        - E57
        - 3D Tiles
        - RVT
        - DGN
    validations:
      required: true

  - type: dropdown
    id: demand-kind
    attributes:
      label: 수요 근거 종류
      description: 실제 사용자 과업이 아니면 구현 우선순위 근거로 사용하지 않습니다.
      options:
        - 실제 사용자 과업
        - Maintainer hypothesis
    validations:
      required: true

  - type: textarea
    id: task-summary
    attributes:
      label: 사용자 과업
      description: 조직명·파일명 없이 어떤 판단을 위해 어떤 두 종류 이상의 source를 함께 여는지 설명하세요.
      placeholder: IFC 설계와 현장 LAS 측량 결과를 같은 좌표에서 비교해 시공 간섭을 검토합니다.
    validations:
      required: true

  - type: input
    id: source-formats
    attributes:
      label: 함께 사용하는 source format
      description: 후보를 포함해 쉼표로 구분합니다.
      placeholder: ifc, las
    validations:
      required: true

  - type: input
    id: demand-evidence
    attributes:
      label: 수요 evidence reference
      description: public-issue:<번호> 또는 private-review:sha256:<digest>만 기록합니다.
      placeholder: public-issue:12

  - type: checkboxes
    id: requested-capabilities
    attributes:
      label: 필요한 capability
      options:
        - label: view
        - label: query
        - label: write — 별도 adapter Gate가 필요합니다.
        - label: roundTrip — 별도 reopen Gate가 필요합니다.

  - type: dropdown
    id: fixture-availability
    attributes:
      label: 공개 테스트 fixture
      description: 파일을 배포하지 않는 cache-only 테스트도 public-test-only로 제출할 수 있습니다.
      options:
        - public-test-only
        - public-redistributable
        - private-review-only
        - none
    validations:
      required: true

  - type: textarea
    id: fixture-evidence
    attributes:
      label: Fixture provenance
      description: 공개 HTTPS URL, byte length, SHA-256, 테스트 사용 조건을 적습니다. URL에 token/query를 넣지 마세요. 샘플 파일은 저장소나 release에 포함할 필요가 없습니다.
      placeholder: |
        URL: https://example.org/public/sample.las
        Bytes: 8388608
        SHA-256: ...
        License: CC0-1.0

  - type: textarea
    id: implementation-evidence
    attributes:
      label: Codec·engine·SDK와 권리
      description: exact artifact/version, license, redistribution 상태를 적습니다. 계약서 원문은 첨부하지 않습니다.
      placeholder: |
        Kind: open-source-codec | network-engine | native-sdk | unknown
        Artifact: npm:package@version
        License: SPDX identifier
        Redistribution: confirmed | review-required | blocked | unknown

  - type: textarea
    id: coordinate-evidence
    attributes:
      label: 좌표·측량 근거
      description: coordinate mode, CRS, datum 변환 필요 여부와 opaque evidence reference를 적습니다.
      placeholder: |
        Mode: projected-crs
        CRS: EPSG:32652
        Datum transformation required: false
        Evidence: private-review:sha256:...

  - type: textarea
    id: qualification-evidence
    attributes:
      label: 기술 qualification 준비
      description: bounded budget, cancellation/cleanup, network policy, platform package, reopen evidence 상태를 적습니다.
      placeholder: |
        Budget evidence: public-evidence:sha256:...
        Lifecycle harness: false
        Network policy: not-applicable
        Platform package: false
        Reopen evidence: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 이슈 안전 확인
      options:
        - label: 고객 모델을 첨부하지 않았습니다.
          required: true
        - label: credential이나 absolute path를 포함하지 않았습니다.
          required: true
        - label: 공개 URL에는 query token이나 비공개 다운로드 권한이 없습니다.
          required: true

  - type: checkboxes
    id: authority
    attributes:
      label: Gate 경계 확인
      options:
        - label: 이 요청은 포맷 admission 또는 production 지원을 의미하지 않습니다.
          required: true
        - label: 이 요청은 BIM semantic authority를 만들지 않습니다.
          required: true
        - label: write/round-trip 지원을 자동으로 승인하지 않습니다.
          required: true
