name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Qualify web-ifc platform package
        run: >-
          npm run qualify:ifc:platform-package --
          --output web-ifc-platform-${{ runner.os }}.json
          --artifact-directory web-ifc-platform-${{ runner.os }}

      - name: Upload web-ifc platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-ifc-platform-${{ runner.os }}
          path: |
            web-ifc-platform-${{ runner.os }}.json
            web-ifc-platform-${{ runner.os }}/*.tgz
          if-no-files-found: error
          retention-days: 7
