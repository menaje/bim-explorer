name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Qualify web-ifc platform package
        run: >-
          npm run qualify:ifc:platform-package --
          --output web-ifc-platform-${{ runner.os }}.json
          --artifact-directory web-ifc-platform-${{ runner.os }}

      - name: Upload web-ifc platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-ifc-platform-${{ runner.os }}
          path: |
            web-ifc-platform-${{ runner.os }}.json
            web-ifc-platform-${{ runner.os }}/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Qualify glTF product surfaces on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product:platform --
          --output gltf-product-${{ runner.os }}.json

      - name: Qualify glTF product surfaces on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:gltf:product:platform --
          --output gltf-product-${{ runner.os }}.json

      - name: Upload glTF product platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gltf-product-${{ runner.os }}
          path: gltf-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify product-scale glTF reference on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product-scale --
          --output gltf-product-scale-${{ runner.os }}.json

      - name: Upload product-scale glTF reference evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gltf-product-scale-${{ runner.os }}
          path: gltf-product-scale-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify product-scale glTF Browser product on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product-scale:web --
          --output gltf-product-scale-browser-${{ runner.os }}.json

      - name: Upload product-scale glTF Browser product evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gltf-product-scale-browser-${{ runner.os }}
          path: gltf-product-scale-browser-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify product-scale glTF staged VS Code on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product-scale:vscode --
          --output gltf-product-scale-vscode-${{ runner.os }}.json

      - name: Qualify product-scale glTF staged VS Code on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:gltf:product-scale:vscode --
          --output gltf-product-scale-vscode-${{ runner.os }}.json

      - name: Qualify product-scale glTF clean VSIX on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product-scale:vscode-install --
          --output gltf-product-scale-vsix-${{ runner.os }}.json

      - name: Qualify product-scale glTF clean VSIX on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:gltf:product-scale:vscode-install --
          --output gltf-product-scale-vsix-${{ runner.os }}.json

      - name: Upload product-scale glTF VS Code evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gltf-product-scale-vscode-${{ runner.os }}
          path: |
            gltf-product-scale-vscode-${{ runner.os }}.json
            gltf-product-scale-vsix-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7
