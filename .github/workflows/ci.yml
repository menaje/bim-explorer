name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Qualify web-ifc platform package
        run: >-
          npm run qualify:ifc:platform-package --
          --output web-ifc-platform-${{ runner.os }}.json
          --artifact-directory web-ifc-platform-${{ runner.os }}

      - name: Upload web-ifc platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-ifc-platform-${{ runner.os }}
          path: |
            web-ifc-platform-${{ runner.os }}.json
            web-ifc-platform-${{ runner.os }}/*.tgz
          if-no-files-found: error
          retention-days: 7
