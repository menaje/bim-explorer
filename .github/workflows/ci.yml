name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - prerelease
      - main
  pull_request:

concurrency:
  group: >-
    bim-explorer-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

  qualification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Qualify federated BIM Surface Browser anchors on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:bim-surface:v0.2:browser --
          --out federated-bim-surface-browser-${{ runner.os }}.json

      - name: Qualify federated BIM Surface Browser anchors on macOS
        if: runner.os == 'macOS'
        run: >-
          npm run qualify:bim-surface:v0.2:browser --
          --out federated-bim-surface-browser-${{ runner.os }}.json

      - name: Upload federated BIM Surface Browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: federated-bim-surface-browser-${{ runner.os }}
          path: federated-bim-surface-browser-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify federated BIM Surface VS Code anchors on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:bim-surface:v0.2:vscode --
          --out federated-bim-surface-vscode-${{ runner.os }}.json

      - name: Qualify federated BIM Surface VS Code anchors on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:bim-surface:v0.2:vscode --
          --out federated-bim-surface-vscode-${{ runner.os }}.json

      - name: Upload federated BIM Surface VS Code evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: federated-bim-surface-vscode-${{ runner.os }}
          path: federated-bim-surface-vscode-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify private federated BIM Surface package candidate
        run: >-
          npm run qualify:bim-surface:v0.2:package --
          --out federated-bim-surface-package-${{ runner.os }}.json

      - name: Upload federated BIM Surface package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: federated-bim-surface-package-${{ runner.os }}
          path: federated-bim-surface-package-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify E57 coordinate profile matrix
        run: >-
          npm run qualify:e57:profiles --
          --out e57-profile-matrix-${{ runner.os }}.json

      - name: Upload E57 coordinate profile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-profile-matrix-${{ runner.os }}
          path: e57-profile-matrix-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify E57 spherical coordinate profile
        run: >-
          npm run qualify:e57:spherical --
          --out e57-spherical-profile-${{ runner.os }}.json

      - name: Upload E57 spherical coordinate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-spherical-profile-${{ runner.os }}
          path: e57-spherical-profile-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify E57 multiple-scan pose profile
        run: >-
          npm run qualify:e57:multiple-scan --
          --out e57-multiple-scan-profile-${{ runner.os }}.json

      - name: Upload E57 multiple-scan pose evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-multiple-scan-profile-${{ runner.os }}
          path: e57-multiple-scan-profile-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify LAS/LAZ point renderer on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:las-laz:renderer --
          --out las-laz-point-renderer-${{ runner.os }}.json

      - name: Qualify LAS/LAZ point renderer on macOS
        if: runner.os == 'macOS'
        run: >-
          npm run qualify:las-laz:renderer --
          --out las-laz-point-renderer-${{ runner.os }}.json

      - name: Upload LAS/LAZ point renderer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: las-laz-point-renderer-${{ runner.os }}
          path: las-laz-point-renderer-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify LAS/LAZ Browser product on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:las-laz:product:web --
          --out las-laz-browser-product-${{ runner.os }}.json

      - name: Qualify LAS/LAZ Browser product on macOS
        if: runner.os == 'macOS'
        run: >-
          npm run qualify:las-laz:product:web --
          --out las-laz-browser-product-${{ runner.os }}.json

      - name: Upload LAS/LAZ Browser product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: las-laz-browser-product-${{ runner.os }}
          path: las-laz-browser-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify LAS/LAZ VS Code product on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:las-laz:product:vscode --
          --out las-laz-vscode-product-${{ runner.os }}.json

      - name: Qualify LAS/LAZ VS Code product on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:las-laz:product:vscode --
          --out las-laz-vscode-product-${{ runner.os }}.json

      - name: Upload LAS/LAZ VS Code product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: las-laz-vscode-product-${{ runner.os }}
          path: las-laz-vscode-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify E57 Browser product on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:e57:product:web --
          --out e57-browser-product-${{ runner.os }}.json

      - name: Qualify E57 Browser product on macOS
        if: runner.os == 'macOS'
        run: >-
          npm run qualify:e57:product:web --
          --out e57-browser-product-${{ runner.os }}.json

      - name: Upload E57 Browser product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-browser-product-${{ runner.os }}
          path: e57-browser-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify E57 VS Code product on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:e57:product:vscode --
          --out e57-vscode-product-${{ runner.os }}.json

      - name: Qualify E57 VS Code product on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:e57:product:vscode --
          --out e57-vscode-product-${{ runner.os }}.json

      - name: Upload E57 VS Code product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-vscode-product-${{ runner.os }}
          path: e57-vscode-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify spherical E57 Browser product on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:e57:spherical:product:web --
          --out e57-spherical-browser-product-${{ runner.os }}.json

      - name: Qualify spherical E57 Browser product on macOS
        if: runner.os == 'macOS'
        run: >-
          npm run qualify:e57:spherical:product:web --
          --out e57-spherical-browser-product-${{ runner.os }}.json

      - name: Upload spherical E57 Browser product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-spherical-browser-product-${{ runner.os }}
          path: e57-spherical-browser-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify spherical E57 VS Code product on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:e57:spherical:product:vscode --
          --out e57-spherical-vscode-product-${{ runner.os }}.json

      - name: Qualify spherical E57 VS Code product on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:e57:spherical:product:vscode --
          --out e57-spherical-vscode-product-${{ runner.os }}.json

      - name: Upload spherical E57 VS Code product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-spherical-vscode-product-${{ runner.os }}
          path: e57-spherical-vscode-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify multiple-scan E57 Browser product on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:e57:multiple-scan:product:web --
          --out e57-multiple-scan-browser-product-${{ runner.os }}.json

      - name: Qualify multiple-scan E57 Browser product on macOS
        if: runner.os == 'macOS'
        run: >-
          npm run qualify:e57:multiple-scan:product:web --
          --out e57-multiple-scan-browser-product-${{ runner.os }}.json

      - name: Upload multiple-scan E57 Browser product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-multiple-scan-browser-product-${{ runner.os }}
          path: e57-multiple-scan-browser-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify multiple-scan E57 VS Code product on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:e57:multiple-scan:product:vscode --
          --out e57-multiple-scan-vscode-product-${{ runner.os }}.json

      - name: Qualify multiple-scan E57 VS Code product on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:e57:multiple-scan:product:vscode --
          --out e57-multiple-scan-vscode-product-${{ runner.os }}.json

      - name: Upload multiple-scan E57 VS Code product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e57-multiple-scan-vscode-product-${{ runner.os }}
          path: e57-multiple-scan-vscode-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify web-ifc platform package
        run: >-
          npm run qualify:ifc:platform-package --
          --output web-ifc-platform-${{ runner.os }}.json
          --artifact-directory web-ifc-platform-${{ runner.os }}

      - name: Upload web-ifc platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-ifc-platform-${{ runner.os }}
          path: |
            web-ifc-platform-${{ runner.os }}.json
            web-ifc-platform-${{ runner.os }}/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Qualify glTF product surfaces on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product:platform --
          --output gltf-product-${{ runner.os }}.json

      - name: Qualify glTF product surfaces on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:gltf:product:platform --
          --output gltf-product-${{ runner.os }}.json

      - name: Upload glTF product platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gltf-product-${{ runner.os }}
          path: gltf-product-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify product-scale glTF reference on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product-scale --
          --output gltf-product-scale-${{ runner.os }}.json

      - name: Upload product-scale glTF reference evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gltf-product-scale-${{ runner.os }}
          path: gltf-product-scale-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify product-scale BIM federation on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:federation:product-scale --
          --output bim-federation-product-scale-${{ runner.os }}.json

      - name: Qualify product-scale BIM federation on macOS
        if: runner.os == 'macOS'
        run: >-
          npm run qualify:federation:product-scale --
          --output bim-federation-product-scale-${{ runner.os }}.json

      - name: Upload product-scale BIM federation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bim-federation-product-scale-${{ runner.os }}
          path: bim-federation-product-scale-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify product-scale glTF Browser product on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product-scale:web --
          --output gltf-product-scale-browser-${{ runner.os }}.json

      - name: Upload product-scale glTF Browser product evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gltf-product-scale-browser-${{ runner.os }}
          path: gltf-product-scale-browser-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify product-scale glTF staged VS Code on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product-scale:vscode --
          --output gltf-product-scale-vscode-${{ runner.os }}.json

      - name: Qualify product-scale glTF staged VS Code on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:gltf:product-scale:vscode --
          --output gltf-product-scale-vscode-${{ runner.os }}.json

      - name: Qualify product-scale glTF clean VSIX on Linux
        if: runner.os == 'Linux'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          xvfb-run -a
          npm run qualify:gltf:product-scale:vscode-install --
          --output gltf-product-scale-vsix-${{ runner.os }}.json

      - name: Qualify product-scale glTF clean VSIX on macOS
        if: runner.os == 'macOS'
        env:
          BIM_EXPLORER_VSCODE_VERSION: 1.131.0
        run: >-
          npm run qualify:gltf:product-scale:vscode-install --
          --output gltf-product-scale-vsix-${{ runner.os }}.json

      - name: Upload product-scale glTF VS Code evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gltf-product-scale-vscode-${{ runner.os }}
          path: |
            gltf-product-scale-vscode-${{ runner.os }}.json
            gltf-product-scale-vsix-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

  federation-platform-matrix:
    needs: qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Download federation platform observations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bim-federation-product-scale-*
          path: platform-evidence
          merge-multiple: true

      - name: Compare federation platform observations
        run: >-
          npm run assemble:federation:product-scale:platform --
          --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --linux platform-evidence/bim-federation-product-scale-Linux.json
          --macos platform-evidence/bim-federation-product-scale-macOS.json
          --output bim-federation-product-scale-platform-matrix.json

      - name: Upload federation platform matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bim-federation-product-scale-platform-matrix
          path: bim-federation-product-scale-platform-matrix.json
          if-no-files-found: error
          retention-days: 7
