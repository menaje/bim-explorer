name: BIM Surface Release

on:
  push:
    tags:
      - "bim-surface-v*"

concurrency:
  group: bim-surface-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout exact package tag history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify tag and BIM Surface version
        run: >-
          node --input-type=module --eval
          'import manifest from "./packages/bim-surface/package.json"
          with {type:"json"};
          if (process.env.GITHUB_REF_NAME !==
          `bim-surface-v${manifest.version}`)
          throw new Error("tag and BIM Surface version differ");'

      - name: Clean install
        run: npm ci

      - name: Full conformance
        run: npm run check

      - name: Runtime dependency audit
        run: npm audit --omit=dev

      - name: Build deterministic BIM Surface release bundle
        run: npm run release:bim-surface

      - name: Upload platform BIM Surface bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bim-surface-release-${{ runner.os }}
          path: dist/bim-surface-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout exact package tag history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install release comparison dependencies
        run: npm ci

      - name: Download platform bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bim-surface-release-*
          path: dist/platforms
          merge-multiple: false

      - name: Compare macOS and Linux bytes
        run: >-
          node scripts/compare-bim-surface-release.mjs
          --left dist/platforms/bim-surface-release-Linux
          --right dist/platforms/bim-surface-release-macOS

      - name: Select verified BIM Surface bundle
        run: >-
          cp -R
          dist/platforms/bim-surface-release-Linux
          dist/release

      - name: Attest executable package and supply-chain manifests
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/release/bim-explorer-bim-surface-*.tgz
            dist/release/bim-explorer-bim-surface-*.spdx.json
            dist/release/release-manifest.json

      - name: Publish or verify immutable package release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$draft" == "true" ]]; then
              echo "An incomplete draft release already exists" >&2
              exit 1
            fi
            mkdir -p dist/published
            gh release download "$GITHUB_REF_NAME" --dir dist/published
            node scripts/compare-bim-surface-release.mjs \
              --left dist/release \
              --right dist/published
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/release/* \
              --draft \
              --verify-tag \
              --prerelease \
              --latest=false \
              --title "BIM Surface v${GITHUB_REF_NAME#bim-surface-v}" \
              --notes-file dist/release/RELEASE_NOTES.md
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false \
              --prerelease \
              --latest=false
          fi

      - name: Verify immutable release and package asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=false
          for attempt in {1..12}; do
            if gh release verify "$GITHUB_REF_NAME"; then
              verified=true
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$verified" != "true" ]]; then
            echo "Immutable release attestation was not available" >&2
            exit 1
          fi
          gh release verify-asset "$GITHUB_REF_NAME" \
            dist/release/bim-explorer-bim-surface-0.1.0.tgz
          gh attestation verify \
            --repo "$GITHUB_REPOSITORY" \
            dist/release/bim-explorer-bim-surface-0.1.0.tgz
